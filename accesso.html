<!DOCTYPE html>
<html lang="en" data-bs-theme="light">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign In · Chef in Tasca</title>

<script>
try {
var t = JSON.parse(localStorage.getItem("tema"));
if (t === "dark" || t === "light"){
document.documentElement.setAttribute("data-bs-theme", t);}
} catch (e) { }
</script>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet" href="css/stile.css">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
</head>

<body class="d-flex flex-column min-vh-100">

<header id="intestazione" class="sticky-top">
<nav class="navbar navbar-expand-md bg-body-tertiary">
<div class="container">

<a class="navbar-brand" href="index.html">
<img src="img/logo.svg" alt="" class="logo me-2">Chef in Tasca
</a>

<button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu-principale"
aria-controls="menu-principale" aria-expanded="false" aria-label="Toggle navigation">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu-principale">
<ul class="navbar-nav me-auto">
<li class="nav-item">
<a class="nav-link" id="link-home" href="index.html">Home</a>
</li>
<li class="nav-item">
<a class="nav-link" id="link-cerca" href="cerca.html">Search</a>
</li>
<li class="nav-item d-none" id="voce-ricettario">
<a class="nav-link" id="link-ricettario"
href="ricettario.html">Cookbook</a>
</li>
<li class="nav-item d-none" id="voce-profilo">
<a class="nav-link" id="link-profilo" href="profilo.html">Profile</a>
</li>
</ul>

<div class="d-flex gap-2">
<button class="btn btn-secondary btn-sm" id="bottone-tema"
type="button">Toggle theme</button>
<a class="btn btn-primary btn-sm" id="bottone-accedi"
href="accesso.html">Sign In</a>
<button class="btn btn-primary btn-sm d-none" id="bottone-esci"
type="button">Logout</button>
</div>
</div>

</div>
</nav>
</header>

<main id="contenuto" class="container py-4 flex-grow-1">

<h1>Sign In</h1>
<p class="text-muted">Sign in to your account or create a new one.</p>

<div class="row g-4" id="moduli">

<!-- Login -->
<div class="col-md-6">
<h2 class="h4">I already have an account</h2>
<form id="form-login" novalidate>
<div class="mb-3">
<label for="login-username" class="form-label">Username</label>
<input type="text" class="form-control" id="login-username">
</div>
<div class="mb-3">
<label for="login-password" class="form-label">Password</label>
<input type="password" class="form-control" id="login-password">
</div>
<p class="text-danger d-none" id="errore-login" role="alert"></p>
<button type="submit" class="btn btn-primary">Sign In</button>
</form>
</div>

<!-- Registrazione -->
<div class="col-md-6">
<h2 class="h4">I'm new here</h2>
<form id="form-registrazione" novalidate>
<div class="mb-3">
<label for="reg-username" class="form-label">Username</label>
<input type="text" class="form-control" id="reg-username">
</div>
<div class="mb-3">
<label for="reg-email" class="form-label">Email</label>
<input type="email" class="form-control" id="reg-email">
</div>
<div class="mb-3">
<label for="reg-password" class="form-label">Password</label>
<input type="password" class="form-control" id="reg-password">
</div>
<div class="mb-3">
<label for="reg-piatto" class="form-label">Favorite dish</label>
<input type="text" class="form-control" id="reg-piatto">
</div>
<p class="text-danger d-none" id="errore-registrazione" role="alert"></p>
<button type="submit" class="btn btn-secondary">Register</button>
</form>
</div>

</div>

</main>

<footer class="footer-pagina text-center py-3">
Chef in Tasca · Recipes from TheMealDB
</footer>

<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/accesso.js"></script>
</body>

</html>
